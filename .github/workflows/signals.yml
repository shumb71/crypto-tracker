name: Señales cripto

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # cada 15 min (GitHub puede retrasarlo algo)
  workflow_dispatch:
    inputs:
      estado:
        description: 'Enviar el resumen completo a Telegram'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Recuperar estado anterior
        run: |
          mkdir -p out
          if git fetch --depth 1 origin signals-data 2>/dev/null; then
            git show FETCH_HEAD:state.json > out/state.json 2>/dev/null || rm -f out/state.json
          fi

      - name: Calcular señales y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signals/run.py --out out ${{ inputs.estado && '--estado' || '' }}

      - name: Publicar resultados en la rama signals-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b signals-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Señales $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" signals-data
